name: 🚀 Deploy Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ─── Detect which app(s) changed ───
  changes:
    name: 🔍 Detect changes
    runs-on: ubuntu-latest
    outputs:
      iching: ${{ steps.filter.outputs.iching }}
      tarot: ${{ steps.filter.outputs.tarot }}
      tuvi: ${{ steps.filter.outputs.tuvi }}
      talkwithme: ${{ steps.filter.outputs.talkwithme }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔎 Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            iching:
              - 'iching/**'
              - 'shared/**'
              - '.github/workflows/deploy.yml'
            tarot:
              - 'tarotnow/**'
              - 'shared/**'
              - '.github/workflows/deploy.yml'
            tuvi:
              - 'tuvinow/**'
              - 'shared/**'
              - '.github/workflows/deploy.yml'
            talkwithme:
              - 'talkwithme/**'
              - 'shared/**'
              - '.github/workflows/deploy.yml'

  # ─── Deploy IChing ───
  deploy-iching:
    name: 🔮 Deploy IChing
    needs: changes
    if: needs.changes.outputs.iching == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iching/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: iching

      - name: 🔨 Build
        run: npm run build
        working-directory: iching

      - name: 🗑️ Xóa file cũ & Upload lên hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./iching/dist/
          server-dir: ./kinhdich/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

  # ─── Deploy TarotNow ───
  deploy-tarot:
    name: 🃏 Deploy TarotNow
    needs: changes
    if: needs.changes.outputs.tarot == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tarotnow/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: tarotnow

      - name: 🔨 Build
        run: npm run build
        working-directory: tarotnow

      - name: 🗑️ Xóa file cũ & Upload lên hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./tarotnow/dist/
          server-dir: ./tarot/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/Cards-jpg/**

  # ─── Deploy TuViNow ───
  deploy-tuvi:
    name: 🌟 Deploy TuViNow
    needs: changes
    if: needs.changes.outputs.tuvi == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tuvinow/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: tuvinow

      - name: 🔨 Build
        run: npm run build
        working-directory: tuvinow

      - name: 🗑️ Xóa file cũ & Upload lên hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./tuvinow/dist/
          server-dir: ./tuvi/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

  # ─── Deploy TalkWithMe ───
  deploy-talkwithme:
    name: 💬 Deploy TalkWithMe
    needs: changes
    if: needs.changes.outputs.talkwithme == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: talkwithme/package-lock.json

      - name: 📦 Install dependencies
        run: npm install
        working-directory: talkwithme

      - name: 🔨 Build
        run: npm run build
        working-directory: talkwithme

      - name: 🗑️ Xóa file cũ & Upload lên hosting (./talk/)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./talkwithme/dist/
          server-dir: ./talk/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: 🔀 Tạo trang chuyển hướng từ ./talkwithme/ sang ./talk/
        run: |
          mkdir -p ./talkwithme_redirect
          cat << 'EOF' > ./talkwithme_redirect/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=/talk/">
            <link rel="canonical" href="https://vunph.id.vn/talk/">
            <title>Chuyển hướng đến TalkWithMe...</title>
            <script>window.location.replace('/talk/' + window.location.search + window.location.hash);</script>
          </head>
          <body>
            <p>Đang chuyển hướng sang <a href="/talk/">/talk/</a>...</p>
          </body>
          </html>
          EOF

      - name: 🚀 Upload trang chuyển hướng lên ./talkwithme/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          security: loose
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./talkwithme_redirect/
          server-dir: ./talkwithme/
          dangerous-clean-slate: true


