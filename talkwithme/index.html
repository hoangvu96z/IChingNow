<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var host = window.location.hostname.toLowerCase();
      if (host !== 'vunph.id.vn' && host !== 'www.vunph.id.vn') return;
      try { window.localStorage.removeItem('sso_token'); } catch (_) {}
      var target = new URL(window.location.href);
      target.protocol = 'https:';
      target.host = 'vunph.click';
      target.searchParams.delete('sso_code');
      target.searchParams.delete('sso_token');
      window.location.replace(target.toString());
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TalkWithMe — Gửi tin nhắn nhanh, không cần đăng nhập. Liên hệ với tôi bất cứ lúc nào." />
  <meta name="keywords" content="talkwithme, liên hệ, gửi tin nhắn, contact form" />
  <title>TalkWithMe — Gửi tin nhắn cho tôi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
